[project]
name = "agent-hitl-workbench"
version = "0.1.0"
description = "Stateful LangGraph human-in-the-loop (HITL) approval, idempotent write-back, and trace-to-eval workbench."
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "fastapi>=0.143,<0.144",
    "httpx>=0.28,<0.29",
    "langgraph>=1.2.15,<1.3",
    "langgraph-checkpoint-sqlite>=2.0,<4",
    "pillow>=10",
    "pydantic-settings>=2.15,<3",
    "pypdfium2>=4",
    "python-docx>=1.1",
    "reportlab>=4",
    "uvicorn>=0.54,<0.55",
]

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hitl_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
